# Ministers'/senior-officials' diaries collection. Manual only, like
# data-refresh: diary files are published quarterly, and the sources are
# shared public infrastructure.
#
# This runs in Actions rather than in the development environment because the
# development environment's network egress policy blocks foi.gov.il and
# odata.org.il; the runner's own outbound access is used instead. The
# collector stays polite and identified either way (same User-Agent, timeouts,
# per-host delay).
#
# mode=probe — read-only reconnaissance; prints a JSON inventory of what each
#              source offers into the job log. Never commits.
# mode=collect — full collection (added after the probe confirms structure).
#
# Two triggers, same manual intent: workflow_dispatch from the UI, and a push
# that touches .github/collect-diaries-request.json — the request file exists
# because the repository's automation token cannot call the dispatch API
# (403), so "manual" is expressed as an explicit, reviewable commit instead.
name: Collect diaries (manual only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = reconnaissance; probe-files = file-access test; collect = full collection'
        type: choice
        options:
          - probe
          - probe-files
          - collect
        default: probe
      commit_changes:
        description: 'Commit collected data if it changed (collect mode only)'
        type: boolean
        default: false
      fresh_fetch:
        description: 'Ignore the saved response cache and re-ask every source'
        type: boolean
        default: false
  push:
    branches: ['main', 'claude/**']
    paths: ['.github/collect-diaries-request.json']

permissions:
  contents: write

concurrency:
  group: collect-diaries
  cancel-in-progress: false

jobs:
  diaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve mode and commit flag
        id: request
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ inputs.commit_changes }}" >> "$GITHUB_OUTPUT"
            echo "fresh=${{ inputs.fresh_fetch }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=$(jq -r '.mode' .github/collect-diaries-request.json)" >> "$GITHUB_OUTPUT"
            echo "commit=$(jq -r '.commit_changes' .github/collect-diaries-request.json)" >> "$GITHUB_OUTPUT"
            echo "fresh=$(jq -r '.freshFetch // false' .github/collect-diaries-request.json)" >> "$GITHUB_OUTPUT"
          fi

      # Diaries are published as spreadsheets, text PDFs and image-only scans.
      # poppler-utils extracts a real text layer where one exists; tesseract
      # with the Hebrew model reads the scans that have none. Both run only at
      # collection time, and every row records which of them produced it.
      - name: Install PDF and OCR tooling
        if: steps.request.outputs.mode == 'collect'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-heb
          pdftotext -v || true
          tesseract --list-langs || true

      # Every collection repeats ~3,000 API calls, and the slow part — asking the
      # archive whether a snapshot exists for each of ~1,200 files — has the same
      # answer every time. The collector already caches responses on disk; this
      # carries that cache between runs, so a re-run after a fix costs minutes
      # instead of hours of someone else's bandwidth. Set freshFetch in the
      # request file when the point of the run is to pick up new publications.
      - name: Restore the collector's response cache
        if: steps.request.outputs.mode == 'collect' && steps.request.outputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/.cache
          key: diaries-http-cache-${{ github.run_id }}
          restore-keys: |
            diaries-http-cache-

      - name: Run the diaries collector
        run: npx tsx scripts/collect-diaries.ts --${{ steps.request.outputs.mode }}

      # Saved even when a later step fails: the cache is what makes the repair
      # run cheap, and a rejected collection is exactly when it is needed.
      - name: Save the collector's response cache
        if: always() && steps.request.outputs.mode == 'collect'
        uses: actions/cache/save@v4
        with:
          path: data/.cache
          key: diaries-http-cache-${{ github.run_id }}

      # Collection changes downstream artifacts (source catalog gains the
      # diaries hosts, data-version counts change, methodology text changes),
      # so classification, analysis, build and the full validation gate all run
      # before anything is committed.
      - name: Classify, analyse, rebuild and validate
        id: gate
        if: steps.request.outputs.mode == 'collect'
        continue-on-error: true
        run: |
          npm run data:diary-analysis
          npm run data:collect-sources
          npm run data:build
          npm run data:validate
          npm run data:report

      # A collection run takes hours, and the gate can reject it over something
      # trivial. Publication stays gated — nothing unvalidated reaches the site
      # — but the collected data is preserved on its own branch so the defect
      # can be fixed against the real data instead of by re-collecting.
      - name: Preserve unvalidated data on a staging branch
        if: steps.request.outputs.mode == 'collect' && steps.gate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diaries-staging
          git add -A data/
          git commit -m "data(staging): unvalidated diary collection from run ${{ github.run_id }}" || {
            echo "nothing to preserve"; exit 1;
          }
          git push -f origin diaries-staging
          echo "::error::Validation rejected this collection. The data is preserved on branch diaries-staging (run ${{ github.run_id }}) so it can be repaired without collecting again."
          exit 1

      - name: Upload the collection log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diaries-collection-log
          path: data/raw/collection-log/collect-diaries*.json
          if-no-files-found: warn

      - name: Show what changed
        if: steps.request.outputs.mode == 'collect'
        run: git --no-pager diff --stat -- data/

      # A collection run takes a while, so the branch has usually moved on by the
      # time it finishes. Rebase onto the remote before pushing, and retry, or
      # the whole run's data would be dropped on a non-fast-forward.
      - name: Commit collected data
        if: |
          steps.request.outputs.mode == 'collect' &&
          steps.request.outputs.commit == 'true' &&
          steps.gate.outcome == 'success'
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: collect published diaries of ministers and senior officials"
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            # The collected data is authoritative for data/; keep it over any
            # concurrent edit to the same generated files.
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort || true
              echo "rebase failed on attempt ${attempt}"
              sleep $((attempt * 5))
              continue
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push collected data after 4 attempts"
          exit 1
